name: "Publish release to PyPI"

on:
  push:
    tags:
      # Publish on version tags, e.g. release-0.1.0
      - "release-[0-9]+.[0-9]+.[0-9]+"
      - "release-[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "release-[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"
      - "release-[0-9]+.[0-9]+.[0-9]+.post[0-9]+"
      - "release-[0-9]+.[0-9]+.[0-9]+.dev[0-9]+"

permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  tests:
    uses: ./.github/workflows/run-tests.yml
    permissions:
      contents: read

  check-version:
    needs:
      - tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          python-version: "3.11"

      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#release-}"
          PACKAGE_VERSION="$(uv run --no-project python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("crates/rinnd/pyproject.toml").read_text())["project"]["version"])')"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Version in git tag is ${TAG_VERSION} but package has version ${PACKAGE_VERSION}!"
            exit 1
          fi

  build-sdist:
    needs:
      - check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # 1.89.0

      - name: Build source distribution
        run: uv build --sdist --out-dir dist crates/rinnd

      - name: Test source distribution
        run: |
          uv venv
          uv pip install pytest dist/*.tar.gz
          uv run --no-project python -m pytest tests -v

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    needs:
      - build-sdist
    name: Build wheels (${{ matrix.image-name }})
    runs-on: ${{ matrix.image-name }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Same platforms as run-tests.yml
        image-name: [ubuntu-latest, windows-latest, macos-latest, ubuntu-26.04-arm, windows-11-arm]
    env:
      # Same Python versions as run-tests.yml
      CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-* cp315-*"
      CIBW_SKIP: "*-musllinux_*"
      # 64-bit only: no 32-bit Windows wheels
      CIBW_ARCHS_WINDOWS: auto64
      CIBW_BEFORE_ALL_LINUX: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
        sh -s -- -y --profile minimal --default-toolchain 1.89.0
      CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
      CIBW_TEST_COMMAND: >-
        python -c "import numpy as np; import rinnd;
        data = np.arange(128, dtype=np.float32).reshape(32, 4);
        index = rinnd.RINND(data, n_neighbors=6, n_trees=2, n_iters=3, random_state=42);
        indices, distances = index.query(data[:3], k=4);
        assert indices.shape == distances.shape == (3, 4);
        assert np.isfinite(distances).all()"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          python-version: "3.11"

      - name: Install Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # 1.89.0

      - name: Download source distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-sdist
          path: dist/

      - name: Build wheels
        # Build the self-contained sdist so Rust path dependencies are available
        # inside the Linux build containers as well as on native runners.
        run: uv tool run --from cibuildwheel==4.3.5 cibuildwheel dist/*.tar.gz --output-dir wheelhouse

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wheels-${{ matrix.image-name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    needs:
      - build-sdist
      - build-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          python-version: "3.11"

      - name: Download distributions artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Validate distributions
        run: uv tool run --from 'twine>=5,<7' twine check dist/*

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish
        # Real PyPI
        run: uv publish --trusted-publishing always
        # TestPyPI
        # run: uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always
