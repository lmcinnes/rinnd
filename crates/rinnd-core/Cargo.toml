[package]
name = "rinnd-core"
description = "High-performance NN-Descent algorithm for approximate k-nearest neighbor search"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["std", "rayon", "batched-euclidean", "batched-angular", "compact-candidates", "batched-leaves", "candidate-membership", "candidate-workspace", "active-candidates", "hybrid-forest", "tiled-leaves"]
std = []
rayon = ["dep:rayon"]
mmap = ["dep:memmap2"]
serde = ["dep:serde", "dep:bincode"]
bench-internals = ["dep:memmap2"]
batched-euclidean = []
batched-angular = []
compact-candidates = []
candidate-membership = []
# Cache-blocked candidate construction (see nndescent/candidates.rs, mod blocked).
blocked-candidates = []
# Hybrid breadth-first / cache-local RP forest for graph-only builds (identical leaves).
hybrid-forest = []
candidate-workspace = []
active-candidates = []
batched-leaves = []
# Register-tiled leaf-initialization kernels (bit-identical distances).
tiled-leaves = []
packed-updates = []

[dependencies]
rayon = { workspace = true, optional = true }
num-traits = { workspace = true }
ordered-float = { workspace = true }
rand = { workspace = true }
rand_xoshiro = { workspace = true }
bytemuck = { workspace = true }
serde = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
approx = { workspace = true }
rand_chacha = { workspace = true }

[[bench]]
name = "distance"
harness = false

[[bench]]
name = "heap"
harness = false


